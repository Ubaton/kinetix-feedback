name: Bug report
description: Report something that is not working in Kinetix.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Kinetix. These reports are public: remove personal information, tokens and private workspace content from text, screenshots and logs.
        For account issues or security concerns, email support@kinetix-app.com instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no sensitive information.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem and where in Kinetix it happens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the error message if there is one.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "For example: Chrome 142, Windows 11, desktop"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or screenshots
      description: Optional. Remove private information before attaching files. Include the app version if available.
